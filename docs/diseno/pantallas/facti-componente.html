<style>
body{margin:0}
@media (prefers-reduced-motion: no-preference){
.f-float{animation:fFloat 3.2s ease-in-out infinite}
.f-blink{animation:fBlink 4.6s infinite;transform-box:fill-box;transform-origin:center}
.f-wave{animation:fWave 1.6s ease-in-out infinite;transform-origin:220px 150px}
.f-wave-l{animation:fWaveL 2.2s ease-in-out infinite .3s;transform-origin:40px 150px}
.f-conf{animation:fConf 2.4s ease-in infinite;transform-box:fill-box;transform-origin:center}
.f-z{animation:fZ 2.4s ease-out infinite;opacity:0}
.f-shake{animation:fShake 2.8s ease-in-out infinite}
.f-pulse{animation:fPulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.f-sweep{animation:fSweep 2.2s ease-in-out infinite;transform-origin:220px 150px}
}
@keyframes fFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fBlink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes fWave{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-22deg)}}
@keyframes fWaveL{0%,100%{transform:rotate(0deg)}50%{transform:rotate(14deg)}}
@keyframes fConf{0%{transform:translateY(-10px) rotate(0deg);opacity:0}15%{opacity:1}100%{transform:translateY(90px) rotate(200deg);opacity:0}}
@keyframes fZ{0%{transform:translate(0,10px);opacity:0}30%{opacity:1}100%{transform:translate(10px,-20px);opacity:0}}
@keyframes fShake{0%,70%,100%{transform:translateX(0)}74%{transform:translateX(-5px)}78%{transform:translateX(5px)}82%{transform:translateX(-4px)}86%{transform:translateX(3px)}}
@keyframes fPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes fSweep{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-14deg)}}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"pose": {"editor": "enum", "default": "saludo", "options": ["saludo", "ok", "festejo", "factura", "pensando", "senalando", "buscando", "alerta", "durmiendo"]}, "size": {"editor": "range", "default": 220, "min": 60, "max": 400, "step": 10, "unit": "px"}, "animated": {"editor": "boolean", "default": true}, "$preview": {"width": 300, "height": 300}}'>
class Component extends DCLogic {
renderVals() {
const pose = this.props.pose ?? 'saludo';
const size = this.props.size ?? 220;
const animPoses = {"saludo": true, "ok": false, "festejo": true, "factura": false, "pensando": false, "senalando": false, "buscando": true, "alerta": true, "durmiendo": true};
const an = this.props.animated;
const a = !(an === false || an === 'false') && !!animPoses[pose];
const v = { size, sizeH: Math.round(size * 320 / 340),
 cFloat: a ? 'f-float' : '', cBlink: a ? 'f-blink' : '', cWave: a ? 'f-wave' : '', cWaveL: a ? 'f-wave-l' : '',
 cConf: a ? 'f-conf' : '', cZ: a ? 'f-z' : '', cShake: a ? 'f-shake' : '', cPulse: a ? 'f-pulse' : '', cSweep: a ? 'f-sweep' : '' };
["saludo", "ok", "festejo", "factura", "pensando", "senalando", "buscando", "alerta", "durmiendo"].forEach(k => { v['is_' + k] = pose === k; });
return v;
}
}
</script>
